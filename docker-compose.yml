version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: fleet
      RABBITMQ_DEFAULT_PASS: fleet
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  vehicle-service:
    build:
      context: ./services/vehicle-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    env_file: .env
    environment:
      DATABASE_URL: postgres://fleet:fleet@postgres:5432/vehicle_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  telemetry-service:
    build:
      context: ./services/telemetry-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    env_file: .env
    environment:
      DATABASE_URL: postgres://fleet:fleet@postgres:5432/telemetry_db?sslmode=disable
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://fleet:fleet@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  alert-service:
    build:
      context: ./services/alert-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    env_file: .env
    environment:
      DATABASE_URL: postgres://fleet:fleet@postgres:5432/alert_db?sslmode=disable
      RABBITMQ_URL: amqp://fleet:fleet@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  simulator:
    build:
      context: ./apps/simulator
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    env_file: .env
    environment:
      TELEMETRY_SERVICE_URL: http://telemetry-service:8082
    depends_on:
      - telemetry-service

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - vehicle-service
      - telemetry-service
      - alert-service

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
