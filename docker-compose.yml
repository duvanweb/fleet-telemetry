version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: fleet
      RABBITMQ_DEFAULT_PASS: fleet
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  db-migrate-vehicle:
    image: migrate/migrate
    volumes:
      - ./services/vehicle-service/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://fleet:fleet@postgres:5432/vehicle_db?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  db-migrate-telemetry:
    image: migrate/migrate
    volumes:
      - ./services/telemetry-service/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://fleet:fleet@postgres:5432/telemetry_db?sslmode=disable", "up"]
    depends_on:
      db-migrate-vehicle:
        condition: service_completed_successfully
    restart: "no"

  db-migrate-alert:
    image: migrate/migrate
    volumes:
      - ./services/alert-service/migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://fleet:fleet@postgres:5432/alert_db?sslmode=disable", "up"]
    depends_on:
      db-migrate-telemetry:
        condition: service_completed_successfully
    restart: "no"

  db-seed:
    image: postgres:16-alpine
    volumes:
      - ./scripts/seed.sql:/seed.sql
    environment:
      PGPASSWORD: fleet
    command: ["psql", "-h", "postgres", "-U", "fleet", "-d", "vehicle_db", "-f", "/seed.sql"]
    depends_on:
      db-migrate-vehicle:
        condition: service_completed_successfully
    restart: "no"

  vehicle-service:
    build:
      context: .
      dockerfile: services/vehicle-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: fleet
      DB_PASSWORD: fleet
      DB_NAME: vehicle_db
      DB_SSLMODE: disable
      RABBITMQ_URL: amqp://fleet:fleet@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-seed:
        condition: service_completed_successfully

  telemetry-service:
    build:
      context: .
      dockerfile: services/telemetry-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: fleet
      DB_PASSWORD: fleet
      DB_NAME: telemetry_db
      DB_SSLMODE: disable
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://fleet:fleet@rabbitmq:5672/
      VEHICLE_SERVICE_URL: http://vehicle-service:8081
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-migrate-telemetry:
        condition: service_completed_successfully

  alert-service:
    build:
      context: .
      dockerfile: services/alert-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: fleet
      DB_PASSWORD: fleet
      DB_NAME: alert_db
      DB_SSLMODE: disable
      RABBITMQ_URL: amqp://fleet:fleet@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-migrate-alert:
        condition: service_completed_successfully

  simulator:
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
    ports:
      - "8090:8090"
    environment:
      TELEMETRY_SERVICE_URL: http://telemetry-service:8082
    depends_on:
      - telemetry-service

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3001:80"
    depends_on:
      - vehicle-service
      - telemetry-service
      - alert-service

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
