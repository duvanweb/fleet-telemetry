name: Frontend CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "apps/web/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"

jobs:
  lint-test-build:
    name: Web App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
